name: deskup
description: "Desktop application updates using Sparkle on macOS and Velopack on Windows."
version: 0.2.0
repository: https://github.com/lingjhf/deskup
homepage: https://github.com/lingjhf/deskup

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: DeskupPlugin
      windows:
        pluginClass: DeskupPluginCApi
